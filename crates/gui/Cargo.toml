[package]
name = "concord-gui"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "GPUI front-end for the concord Discord client core"
license = "GPL-3.0-only"
publish = false

[dependencies]
# The upstream concord crate, consumed purely as a library. Everything under
# `concord::discord` and `concord::app` is UI-agnostic (verified: zero
# ratatui/crossterm references), so the GUI links against it unmodified.
#
# `default-features = false` keeps the initial shell buildable without the
# system media stack (pipewire/openh264/cpal). Voice and screenshare are
# re-enabled via the `media` feature below once the shell is wired up.
concord = { path = "../..", default-features = false }

gpui = "0.2.2"
gpui_http_client = "0.2.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2"] }
futures = "0.3"

anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros"] }
tracing = "0.1"
serde_json = "1"
notify-rust = { version = "4", default-features = false, features = ["d"] }

[features]
# Voice playback, screenshare and camera are not optional. A Discord client
# that cannot hear a call or see a stream is not a Discord client, and making
# them a build flag meant the paths nobody built were the paths nobody tested -
# which is exactly how the "media does not build" claim survived long after it
# had stopped being true.
default = ["media"]
# Kept as a name so the core's two features are turned on together, and so
# `--no-default-features` remains a way to build the interface alone when
# working on it.
#
# QUIRK, unverified: while media was opt-in, deploy.sh warned that a zbus
# worker panicked at startup - non-fatal, affecting the desktop portal. It has
# not been reproduced since, and the build error that made media opt-in in the
# first place had already stopped happening long before anyone re-checked.
# Treat both as stale until seen again on real hardware.
media = ["concord/voice-playback", "concord/stream-broadcast"]
# Offline demo state, selected at runtime with the token "test".
fixtures = ["concord/fixtures"]
